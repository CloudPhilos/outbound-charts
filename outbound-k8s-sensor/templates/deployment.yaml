{{- if .Values.env.tenantId }}{{ fail "env.tenantId was replaced by env.clusterName in chart 2.0.0" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbound-k8s-sensor
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: outbound-k8s-sensor
  template:
    metadata:
      labels:
        app: outbound-k8s-sensor
    spec:
      {{- if .Values.imagePullSecret }}
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      {{- end }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      containers:
        - name: outbound-k8s-sensor
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: API_KEY_SECRET_NAME
              value: {{ .Values.env.apiKeySecretName | quote }}
            - name: AWS_REGION
              value: {{ .Values.env.awsRegion | quote }}
            - name: ENDPOINT_URL
              value: {{ .Values.env.endpointUrl | quote }}
            - name: CLUSTER_NAME
              value: {{ .Values.env.clusterName | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.env.environment | quote }}
            - name: DEPLOYMENT_ENVIRONMENT
              value: {{ .Values.env.deploymentEnvironment | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
