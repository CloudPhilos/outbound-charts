replicaCount: 1

image:
  repository: ghcr.io/cloudphilos/outbound-k8s-sensor
  pullPolicy: IfNotPresent
  tag: "stable"

# Name of an existing dockerconfigjson secret in the release namespace. Only
# needed for a private registry; the default image above is public.
imagePullSecret: ""

serviceAccount:
  create: true
  name: "outbound-k8s-sensor"
  # For EKS with IRSA (IAM Roles for Service Accounts):
  # Set this to your IAM role ARN that has permissions to access AWS Secrets Manager
  roleArn: ""

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 10m
    memory: 64Mi

env:
  # How the sensor gets its API key. On EKS it reads AWS Secrets Manager with
  # the IRSA role above, from the path in apiKeySecretName. Anywhere else,
  # create a Kubernetes Secret holding the key and name it here instead:
  #   kubectl create secret generic outbound-api-key --from-literal=api_key=...
  apiKeySecret:
    name: ""
    key: "api_key"
  apiKeySecretName: "/cloudphilos/outbound/api-key"
  awsRegion: "eu-west-1"

  # Outbound API endpoint (DO NOT CHANGE unless directed by support)
  endpointUrl: "https://api.outbound.cloudphilos.net/v1/ingest/ip"

  # Name of this Kubernetes cluster. Must match the EKS cluster name exactly -
  # Outbound matches on it to show the cluster as enrolled. Left empty, pods
  # are still reported but the cluster never shows as enrolled.
  clusterName: ""

  logLevel: "INFO" # Options: DEBUG, INFO, WARN, ERROR
  environment: "production" # or "staging", "development"
  deploymentEnvironment: "eks" # or "gke", "aks", "self-hosted"
