name: Release Helm Charts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "outbound-k8s-sensor/**"
      - "!outbound-k8s-sensor/README.md"
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Package Helm charts
        run: |
          # Create a directory for packaged charts
          mkdir -p .cr-release-packages

          # Package all charts
          for chart in */Chart.yaml; do
            chart_dir=$(dirname "$chart")
            echo "Packaging $chart_dir..."
            helm package "$chart_dir" --destination .cr-release-packages
          done

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages

      - name: Update Helm repository
        run: |
          # Copy packaged charts to gh-pages
          mkdir -p gh-pages
          cp .cr-release-packages/*.tgz gh-pages/ 2>/dev/null || true

          # Generate or update index.yaml
          helm repo index gh-pages --url https://charts.cloudphilos.net

          # Create CNAME file for custom domain
          echo "charts.cloudphilos.net" > gh-pages/CNAME

      - name: Commit and push to gh-pages
        working-directory: gh-pages
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .
          git diff --staged --quiet || git commit -m "Release Helm charts from ${{ github.sha }}"
          git push origin gh-pages
